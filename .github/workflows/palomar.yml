# Dispatch only after exact-source review and the specific security approval.
# Publication of this guarded workflow is not registry submission or acceptance.
name: Palomar full mechanical verification
on:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: "The user's specifically agreed authorization relationship for the frozen source"
        required: true
        type: choice
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer
      approve_binary_scoped_apparmor:
        description: "True only after specific approval for the pinned exact-bubblewrap userns profile on the disposable hosted runner if required"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  require-specific-security-approval:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit approval before invoking the conditional official installer
        env:
          APPROVED: ${{ inputs.approve_binary_scoped_apparmor }}
        run: test "$APPROVED" = true
  palomar-full:
    needs: require-specific-security-approval
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: highercell01
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ format('{{"comparator_config_path":"comparator.json","authorization_relationship":"{0}"}}', inputs.authorization_relationship) }}
