version: "v0.4"
project:
  name: "Fundamental Groups of Arbitrary Higher-Cell Attachments"
  description: >-
    Higher-cell attachment invariance for ordinary topological fundamental groups.
    For any path-connected topological space X, any basepoint, an index type in
    an independent universe, independently varying cell dimensions at least three,
    and arbitrary continuous unit-sphere attaching maps, the genuine adjunction
    quotient of X and the coproduct of closed Euclidean unit balls is constructed
    with its quotient topology. The actual inclusion-induced fundamental-group
    homomorphism is bijective and is the underlying homomorphism of the displayed
    multiplicative equivalence. Mixed dimensions and the empty family are included.
    No finiteness, countability, CW, separation or local-connectivity hypotheses
    are added, and no retraction, simple-connectivity or kernel oracle is assumed.
  authors: ["Arthur Freitas Ramos", "David Barros Hulak", "Ruy Jose Guerra Barretto de Queiroz"]
  responsible_maintainers: ["Arthur Freitas Ramos"]
  license: "Apache-2.0"
classification:
  arxiv: ["math.AT", "math.CT"]
  msc2020: ["55Q05", "18B40"]
sources:
  - title: "Algebraic Topology"
    authors: ["Allen Hatcher"]
    type: book
    id: "https://pi.math.cornell.edu/~hatcher/AT/AT..pdf#page=62"
    location: "Section 1.2, Exercise 6, printed page 53, live Cornell edition"
    relationship: formalizes
    note: >-
      The source states fixed-dimensional attachment invariance. This theorem
      explicitly strengthens it to mixed dimensions. The exercise's separate
      discrete-complement application is outside the formalized scope.
      No mathematical novelty claim is made.
    author_endorsement: not-contacted
  - title: "The Directed Van Kampen Theorem in Lean"
    authors: ["Henning Basold", "Peter Bruin", "Dominique Lawson"]
    type: "conference paper and formalization"
    id: "10.4230/LIPIcs.ITP.2024.8"
    relationship: builds-on
    location: "Credited path-subdivision and homotopy-grid infrastructure through the ordinary groupoid bridge"
    note: "Inherited source and MIT notices are preserved; no independent authorship is claimed."
    author_endorsement: not-contacted
related_formalizations:
  - id: "https://github.com/Arthur742Ramos/cell-attachment-lean/tree/8883b95e8ace951e27c2bc86f95d02397787dd59"
    relationship: builds-on
    note: >-
      The actual adjunction quotient, open-cover and jointly continuous radial
      geometry are generalized from complex two-cells to dependent Euclidean
      balls. Its abstract vertex-group quotient bridge is reused unchanged.
  - id: "https://github.com/Arthur742Ramos/classical-svk-lean/tree/874680e16db88b4a41daadf56eafbac79fd2f748"
    relationship: builds-on
    note: "Exact accepted ordinary all-object fundamental-groupoid open-cover pushout infrastructure."
  - id: "https://github.com/Sebi-Kumar/mathlib4/tree/037ad801e1e5a5b7aa1750957c07f7769812effc"
    relationship: builds-on
    note: >-
      Sebastian Kumar's unmerged mathlib PR 28246 supplies the simply-connected
      sphere theorem and its required loop-factorization lemma. Only their required
      closure is vendored, with documented narrow pin-compatibility adaptations,
      original Apache-2.0 notices and exact SHA provenance. No sphere novelty is claimed.
  - id: "https://github.com/Dominique-Lawson/Directed-Topology-Lean-4/tree/009529606c66d37ef93b4b81b8587f71ce4d2c56"
    relationship: builds-on
    note: "Basold-Bruin-Lawson subdivision helpers retain MIT license and original source credits."
