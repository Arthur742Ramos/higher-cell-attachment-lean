fidelity:
  divergences: >-
    Cell dimensions vary across the arbitrary family, strengthening the source's
    fixed-dimension statement. There are no added mathematical hypotheses. Actual
    unit spheres and closed balls lie in EuclideanSpace over Fin (d i), using a
    dependent topological coproduct and boundary-generated quotient topology.
    The all-object groupoid pushout handles disconnected overlaps. The separate
    complement-of-discrete-subspace application is not claimed.
